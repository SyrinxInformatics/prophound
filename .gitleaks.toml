# gitleaks configuration: the default rules, plus two line shapes the generic-api-key rule
# mistakes for keys. Read automatically from the repository root (CI: the guard job).
title = "prophound gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "NCBI assembly accessions (\"accession\": \"GCF_000284415.1_ASM28441v2_genomic\")"
regexTarget = "line"
regexes = ['''^\s*"accession":\s*"GC[AF]_\d{9}\.\d+(_[A-Za-z0-9.]+)*(_genomic)?",?\s*$''']  # the whole line, nothing else on it

[[allowlists]]
description = "conda package pins in environment files (- keyutils=1.6.3=hb9d3cd8_0)"
regexTarget = "line"
regexes = ['''^\s*-\s*[A-Za-z0-9_.+-]+=[0-9][A-Za-z0-9_.+]*=[A-Za-z0-9_]+\s*$''']  # the whole line
