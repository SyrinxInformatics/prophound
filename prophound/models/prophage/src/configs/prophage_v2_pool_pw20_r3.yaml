# prophage_v2_pool_pw20_r3: replicate 3/3 (seed 15) of the pooling + pos_weight=20 + amp=false (the prophage_v1_positional combination, retrained on the current pipeline: epochs=20, init_mode=encoder_only) config.
#
# One of the 2x3 replicate runs decided 2026-09-17: both candidate base-model configs, three
# seeds each, distinct run_name per replicate so each gets its own runs/ dir
# (the 812125/812131 duplicate submission shared one dir and overwrote itself).
# Identical to prophage_v1_positional_clean.yaml except run_name, seed, loss.pos_weight (auto->20.0) and training.amp (true->false).
# Launcher: src/prophage_v2_replicates_gpu.slurm (job array, 3-day walltime).

run_name: prophage_v2_pool_pw20_r3

data:
  manifest_csv: data/manifest_windows.filtered.csv
  splits_dir: splits
  window_len: 10000
  stride: 1000
  use_neg_types_in_train: ["far_neg", "near_neg", "positive"]
  use_neg_types_in_val: ["far_neg", "near_neg", "positive"]
  use_neg_types_in_test: ["far_neg", "near_neg", "positive"]

training:
  seed: 15
  batch_size: 128
  num_workers: 2
  epochs: 20
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 0.5
  amp: false
  auto_resume: true
  init_checkpoint: runs/prophage_v0/checkpoints/best.pt
  init_mode: encoder_only
  save_every_sec: 1800
  save_every_steps: 500
  slurm_margin_sec: 600
  early_stopping:
    metric: val_auprc
    patience: 5
    mode: max

loss:
  pos_weight: 20.0

model:
  type: rc_cnn
  combine: "max"
  channels: [64, 128, 256]
  kernel_sizes: [15, 11, 7]
  dropout: 0.2
  fc_dim: 256
  pooling: "adaptive_max"
  pool_bins: 16
