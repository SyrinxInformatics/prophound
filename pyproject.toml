[project]
authors = [
    {name = "Jacob Alford", email = "jalford0000@gmail.com"},
    {name = "Benjamin Alford", email = "ssolar5.dev@gmail.com"},
]
name = "prophound"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Recall-first, database-free prophage screen for prokaryotic genomes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[project.scripts]
prophound = "prophound.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
prophound = { path = ".", editable = true }

[tool.pixi.tasks]
prophound = "prophound"

[tool.pixi.dependencies]
pytorch = ">=2.4.0,<3"
biopython = ">=1.86,<2"
pytest = ">=9.0.0,<10"
sphinx = ">=8.2.3,<9"
mypy = ">=1.18.2,<2"
scikit-learn = ">=1.7.2,<2"
pandas = ">=2.2,<3"
pyfaidx = ">=0.8,<1"
tqdm = ">=4.66,<5"
pyyaml = ">=6.0,<7"
