[project]
authors = [{name = "Syrinx55", email = "jalford0000@gmail.com"}, {name = "Ssolar5", email = "ssolar5.dev@gmail.com"}]
name = "mge-detect"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Database-independent tool using machine learning to detect known mobile genetic elements and predict novel ones"
readme = "README.md"
license = "BSD-2-Clause-Patent"
license-files = ["LICENSE.txt"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
mge_detect = { path = ".", editable = true }

[tool.pixi.tasks]
mge-detect = "python3 src/mge_detect/mge_detect.py"

[tool.pixi.dependencies]
tensorflow-cpu = ">=2.18.0,<3"
biopython = ">=1.85,<2"
