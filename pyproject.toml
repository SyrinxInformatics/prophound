[project]
authors = [
    {name = "Jacob Alford", email = "jalford0000@gmail.com"},
    {name = "Benjamin Alford", email = "ssolar5.dev@gmail.com"},
]
name = "prophound"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Recall-first, database-free prophage screen for prokaryotic genomes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# What `prophound predict` needs; dev and training tools (scikit-learn for
# train_prophage's metrics) stay in [tool.pixi.dependencies].
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyfaidx>=0.8,<1",
    "tqdm>=4.66,<5",
    "pyyaml>=6,<7",
    "biopython>=1.86,<2",
]

[project.scripts]
prophound = "prophound.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# The research tree lives inside the package directory; keep it out of the
# wheel and sdist. The bundled model config and
# weights are added with packaging (docs/cli-and-packaging.md "Distribution").
[tool.hatch.build]
exclude = [
    "prophound/models/prophage/analysis",
    "prophound/models/prophage/scripts",
    "prophound/models/prophage/notes",
    "prophound/models/prophage/splits",
    "prophound/models/prophage/runs",
    "prophound/models/prophage/summary.csv",
    "prophound/models/prophage/README.md",
    "prophound/models/prophage/src/configs",
    "*.slurm",
]

[tool.hatch.build.targets.wheel]
packages = ["prophound"]

# Keep the sdist to code, tests, the example (the smoke test's input) and licence
# files; the docs are read on GitHub.
[tool.hatch.build.targets.sdist]
only-include = ["prophound", "tests", "examples", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE", "NOTICE",
                "pyproject.toml"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
prophound = { path = ".", editable = true }

[tool.pixi.tasks]
prophound = "prophound"
test = "pytest -q tests"
# the example genome end to end (about 2 minutes on CPU, seconds on a GPU)
smoke = "pytest -q -m slow tests/test_example.py"
# the commit and push hooks in .githooks/ (scripts/check_commit.py); once per clone
install-hooks = "git config core.hooksPath .githooks"
# what CI checks: secrets and files that do not belong, over every tracked file
check-commit = "python3 scripts/check_commit.py --all"

[tool.pytest.ini_options]
markers = ["slow: end-to-end runs of the model (run with -m slow, or `pixi run smoke`)"]
addopts = "-m 'not slow'"

[tool.pixi.dependencies]
pytorch = ">=2.4.0,<3"
biopython = ">=1.86,<2"
pytest = ">=9.0.0,<10"
sphinx = ">=8.2.3,<9"
mypy = ">=1.18.2,<2"
ruff = ">=0.6,<1"
scikit-learn = ">=1.7.2,<2"
pandas = ">=2.2,<3"
pyfaidx = ">=0.8,<1"
tqdm = ">=4.66,<5"
pyyaml = ">=6.0,<7"

# Lint target for the whole codebase. Uppercase
# locals (L for a length, G for a genome list) and torch's `functional as F`
# are allowed; everything else in the selection is meant to pass.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["archive", "prophound/models/prophage/notes"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "SIM", "I", "PIE", "C90", "N"]
ignore = ["N806", "N803", "N812", "B905"]

[tool.ruff.lint.mccabe]
max-complexity = 15
