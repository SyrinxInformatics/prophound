[project]
authors = [
    {name = "Jacob Alford", email = "jalford0000@gmail.com"},
    {name = "Benjamin Alford", email = "ssolar5.dev@gmail.com"},
]
name = "mge-detect"
requires-python = ">= 3.11"
version = "0.1.0"
description = "Database-independent tool using machine learning to detect known mobile genetic elements and predict novel ones"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
mge_detect = { path = ".", editable = true }

[tool.pixi.tasks]
mge-detect = "python3 src/mge_detect/mge_detect.py"

[tool.pixi.dependencies]
tensorflow = ">=2.18.0,<3"
biopython = ">=1.85,<2"
pytest = ">=8.4.2,<9"
sphinx = ">=8.2.3,<9"
mypy = ">=1.18.2,<2"
scikit-learn = ">=1.7.2,<2"
